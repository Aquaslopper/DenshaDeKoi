name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  msvc:
    name: MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The atlas must sit next to the executable; the game loads it at startup.
      - name: Stage game
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/denshadekoi.exe dist/
          Copy-Item build/Release/denshadekoi_inspector.exe dist/
          Copy-Item cards_atlas.png dist/
          Copy-Item assets/the-city.jpg dist/
          Copy-Item assets/koidenscha.png dist/
          Copy-Item assets/fonts dist/fonts -Recurse
          Copy-Item assets/sfx dist/sfx -Recurse

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: denshadekoi-windows-msvc
          path: dist/
          if-no-files-found: error

  mingw:
    name: MinGW-w64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja git

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Stage game
        run: |
          mkdir -p dist
          cp build/denshadekoi.exe dist/
          cp build/denshadekoi_inspector.exe dist/
          cp cards_atlas.png dist/
          cp assets/the-city.jpg dist/
          cp assets/koidenscha.png dist/
          cp -R assets/fonts dist/fonts
          cp -R assets/sfx dist/sfx

      - name: Upload game
        uses: actions/upload-artifact@v4
        with:
          name: denshadekoi-windows-mingw
          path: dist/
          if-no-files-found: error
